# Everything check.sh covers, on Linux, macOS and Windows, plus the cloud test against AWS Emulator.
name: checks

on:
  push:
    branches: [main, windows]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # On Windows too: there it is Git Bash, which check.sh and the tests run under.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-
      - name: Format, lints, unit tests, end-to-end, damage and cloud tests
        run: ./check.sh

  cloud:
    name: cloud storage (AWS Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cloud-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cloud-${{ runner.os }}-
      # AWS's own local stand-in for S3, from their signed package.
      - name: AWS Emulator
        run: |
          base=https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest
          curl -fsSLO $base/aws-emulator_amd64.deb
          curl -fsSLO $base/aws-emulator_amd64.deb.sig
          curl -fsSLo aws-publishing.asc https://downloads.aws.com/keys/gpg/current.asc
          gpg --import aws-publishing.asc
          gpg --fingerprint ssm-publishing@amazon.com | tr -d ' ' | grep -q 98BCF336A3BE53B734E967C52E5BF49BD940F624
          gpg --verify aws-emulator_amd64.deb.sig aws-emulator_amd64.deb
          sudo apt-get install -y ./aws-emulator_amd64.deb
          aws-emulator -v
          aws --version
      - name: Build without the window
        run: cargo build --release --no-default-features
      - name: Cloud destination test
        run: CAHOOTS_TEST_S3=emulator sh tests/cloud.sh target/release/cahoots

  # The image is only published with a release, but it is built and tried on every push so
  # that it still works when the time comes.
  image:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t cahoots .
      - name: The daemon starts, answers and stops
        run: sh tests/docker.sh cahoots
