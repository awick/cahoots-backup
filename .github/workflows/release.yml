# Publishes a GitHub release named after the version in Cargo.toml, with binaries for
# macOS, Linux and Windows, and Docker images of the daemon for amd64 and arm64 at
# ghcr.io/<owner>/<repository>. Started by hand (Actions > release > Run workflow, or
# `gh workflow run release`): raise the version in Cargo.toml, push, then run it.
# `gh workflow run release -f dry_run=true` builds and tests it all and publishes nothing.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test everything, but publish nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: version from Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no version in Cargo.toml"; exit 1; }
          if [ "${{ inputs.dry_run }}" != true ] && gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released: raise the version in Cargo.toml first"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          # The older Ubuntu, so the binaries also run on systems with an older C library.
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          # With cahootsw.exe, the same program without a console. It also runs on Arm.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: --features windowed
    # On Windows too, where it is Git Bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --profile dist --locked --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Package
        run: |
          dir=cahoots-${{ needs.version.outputs.version }}-${{ matrix.name }}
          mkdir "$dir"
          cp LICENSE README.md "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/dist/cahoots.exe target/${{ matrix.target }}/dist/cahootsw.exe "$dir/"
            7z a "$dir.zip" "$dir"
          else
            cp target/${{ matrix.target }}/dist/cahoots "$dir/"
            tar -czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            cahoots-*.tar.gz
            cahoots-*.zip
          if-no-files-found: error

  publish:
    name: publish
    if: ${{ !inputs.dry_run }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum cahoots-*.tar.gz cahoots-*.zip >SHA256SUMS
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cahoots Backup $VERSION" --generate-notes cahoots-*.tar.gz cahoots-*.zip SHA256SUMS

  # One image per kind of processor, each built on a runner of that kind, then joined
  # under one name so `docker pull` picks the right one.
  image:
    name: docker image (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Build, try and push
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker build -t "$image:$VERSION-$ARCH" .
          sh tests/docker.sh "$image:$VERSION-$ARCH"
          if [ "${{ inputs.dry_run }}" = true ]; then exit 0; fi
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$VERSION-$ARCH"

  image-manifest:
    name: docker image (both)
    if: ${{ !inputs.dry_run }}
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Join them under the version and latest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$image:$VERSION" -t "$image:latest" \
            "$image:$VERSION-amd64" "$image:$VERSION-arm64"
