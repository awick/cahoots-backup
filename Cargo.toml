[package]
name = "cahoots-backup"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Encrypted, deduplicated backups between friends"
repository = "https://github.com/awick/cahoots-backup"
homepage = "https://cahootsbackup.com"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process", "system"] }

# The window draws with OpenGL, except on Windows, where many computers (and every Remote
# Desktop session) have too old an OpenGL: there it draws with DirectX.
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["clipboard", "default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["clipboard", "default_fonts", "wgpu"] }
winapi-util = "0.1.11"
# For the calls in os::windows::sys.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
windows-registry = "0.6.1"

# Puts the icon and the program's name into the Windows programs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
data-encoding = "2.11.1"
fastcdc = "5.0.0"
fs2 = "0.4.3"
futures = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
iroh = "1.5.0"
notify = "8.2.2"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"], optional = true }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rusty-s3 = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
url = "2.5.8"
walkdir = "2.5.0"
zstd = "0.14.4"

[lib]
name = "cahoots_backup"
path = "src/lib.rs"

[[bin]]
name = "cahoots"
path = "src/main.rs"

# Windows only, built with `--features windowed`: the same program without a console, for
# the window and for starting at login. A console program started from the desktop gets a
# black console window of its own.
[[bin]]
name = "cahootsw"
path = "src/cahootsw.rs"
required-features = ["windowed"]

[profile.release]
opt-level = 3
strip = true

# For binaries handed to others (GitHub releases, `cargo build --profile dist`): optimised
# across crates, which makes them smaller and a little faster but several times slower to
# link, so everyday release builds and the checks do without it.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[dev-dependencies]
# A clock that tests of deadlines can stop.
tokio = { version = "1.54.1", features = ["test-util"] }

[features]
default = ["gui"]
# The graphical interface (`cahoots gui`). Build with --no-default-features to leave it out.
gui = ["dep:eframe", "dep:rfd"]
windowed = ["gui"]
