[package]
name = "super-duper-backup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
data-encoding = "2.11.1"
fastcdc = "5.0.0"
filetime = "0.2.30"
fs2 = "0.4.3"
futures = "0.3.34"
globset = "0.4.21"
hex = "0.4.3"
iroh = "1.5.0"
libc = "0.2.191"
notify = "8.2.2"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.4"
ratatui = "0.30.2"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
walkdir = "2.5.0"
zstd = "0.14.4"

[[bin]]
name = "sdb"
path = "src/main.rs"

[profile.release]
opt-level = 3
