<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cahoots Backup">
  <title>Cahoots Backup</title>
  <!-- Copyright Andy Wick. SPDX-License-Identifier: Apache-2.0 -->
  <!-- Two drives in cahoots: each keeps the other's backup, and only its owner holds the key. -->
  <g>
    <clipPath id="behind">
      <rect x="32" y="62" width="120" height="146" rx="22" transform="rotate(-10 92 134)"/>
    </clipPath>
    <!-- the friend's drive, behind -->
    <g transform="rotate(-10 92 134)">
      <rect x="32" y="62" width="120" height="146" rx="22" fill="#1f2a44"/>
      <rect x="44" y="74" width="96" height="78" rx="13" fill="#2f3e63"/>
      <circle cx="58" cy="181" r="7.5" fill="#3ddc97"/>
      <rect x="76" y="171" width="64" height="7.5" rx="3.75" fill="#44557f"/>
      <rect x="76" y="185" width="64" height="7.5" rx="3.75" fill="#44557f"/>
    </g>
    <!-- the shadow yours casts on it -->
    <g clip-path="url(#behind)">
      <rect x="99" y="57" width="120" height="146" rx="22" fill="#0b1226" opacity="0.35" transform="rotate(9 166 124)"/>
    </g>
    <!-- yours, in front, leaning on it -->
    <g transform="rotate(9 166 124)">
      <rect x="106" y="50" width="120" height="146" rx="22" fill="#1d7f69"/>
      <rect x="118" y="62" width="96" height="78" rx="13" fill="#2ba88c"/>
      <!-- padlock -->
      <path d="M150 97 v-9 a16 16 0 0 1 32 0 v9" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round"/>
      <rect x="141" y="95" width="50" height="37" rx="8" fill="#ffd166"/>
      <circle cx="166" cy="109" r="5.5" fill="#1d7f69"/>
      <rect x="163.25" y="109" width="5.5" height="13" rx="2.75" fill="#1d7f69"/>
      <circle cx="132" cy="169" r="7.5" fill="#d9fff1"/>
      <rect x="150" y="159" width="64" height="7.5" rx="3.75" fill="#15624f"/>
      <rect x="150" y="173" width="64" height="7.5" rx="3.75" fill="#15624f"/>
    </g>
  </g>
</svg>
